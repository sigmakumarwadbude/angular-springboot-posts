services:

  postgres:
    image: postgres:17
    container_name: posts-postgres
    environment:
      POSTGRES_DB: postsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  posts-api:
    build:
      context: ./backend
    container_name: posts-api
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: